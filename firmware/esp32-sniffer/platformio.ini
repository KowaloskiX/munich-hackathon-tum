[platformio]
default_envs = sniffer-01, sniffer-02

[env]
platform = espressif32 @ ^6.10.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter =
  +<*>
  -<wifi_scan.cpp>
build_unflags =
  -std=gnu++11
lib_deps =
  bblanchon/ArduinoJson @ ^7.4.2
build_flags =
  -std=gnu++17
  ; Application logs report failures with rate limiting; suppress repetitive
  ; lwIP/HTTPClient error strings that otherwise hide capture diagnostics.
  -D CORE_DEBUG_LEVEL=0
  -D SNIFFER_FIRMWARE_VERSION=\"1.0.0\"
  -D SNIFFER_LAMP_PIN=2
  -D SNIFFER_LAMP_ACTIVE_HIGH=1

; The same source is flashed twice. Only the stable node ID and heartbeat phase
; differ, so the backend sees two independent fleet members.
[env:sniffer-01]
board = esp32dev
build_flags =
  ${env.build_flags}
  -D SNIFFER_NODE_ID=\"esp-sniffer-01\"
  -D SNIFFER_API_TOKEN=SNIFFER_API_TOKEN_01
  -D SNIFFER_HEARTBEAT_PHASE_MS=0

[env:sniffer-02]
board = esp32dev
build_flags =
  ${env.build_flags}
  -D SNIFFER_NODE_ID=\"esp-sniffer-02\"
  -D SNIFFER_API_TOKEN=SNIFFER_API_TOKEN_02
  -D SNIFFER_HEARTBEAT_PHASE_MS=1500

; Diagnostic builds print every attack-relevant captured management frame,
; periodic counters, alerts and heartbeat results to the 115200-baud console.
[env:sniffer-01-debug]
extends = env:sniffer-01
build_flags =
  ${env:sniffer-01.build_flags}
  -D SNIFFER_SERIAL_TRACE=1

[env:sniffer-02-debug]
extends = env:sniffer-02
build_flags =
  ${env:sniffer-02.build_flags}
  -D SNIFFER_SERIAL_TRACE=1

; Bench integration profile: normal telemetry plus the safe serial `t` command.
; The command injects frames only into the local detector; it transmits no RF.
[env:sniffer-01-demo]
extends = env:sniffer-01-debug
build_flags =
  ${env:sniffer-01-debug.build_flags}
  -D SNIFFER_SERIAL_SELF_TEST=1

; Local console mode still associates with the monitored AP to pin the radio,
; but does not POST when no backend is available.
[env:sniffer-01-console]
extends = env:sniffer-01-debug
build_flags =
  ${env:sniffer-01-debug.build_flags}
  -D SNIFFER_TELEMETRY_ENABLED=0
  -D SNIFFER_SERIAL_SELF_TEST=1

; One-time helper used to discover the configured SSID's BSSID and channel.
[env:wifi-scan]
board = esp32dev
build_src_filter =
  -<*>
  +<wifi_scan.cpp>

; Pure C++ tests for detection thresholds, cooldown and the four-second lamp
; pattern. No ESP32 hardware is required for this environment.
[env:native]
platform = native
framework =
test_framework = unity
test_build_src = no
lib_deps =
build_flags =
  -std=gnu++17
