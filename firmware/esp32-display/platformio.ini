[platformio]
default_envs = waveshare-s3-touch-lcd-1_28

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_unflags =
  -std=gnu++11
lib_deps =
  bblanchon/ArduinoJson @ 7.4.3
  links2004/WebSockets @ 2.7.3
build_flags =
  -std=gnu++17
  -D CORE_DEBUG_LEVEL=1
  -D HMI_FIRMWARE_VERSION=\"1.0.0\"
  -D USER_SETUP_LOADED=1
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT7=1

; Target hardware: Waveshare ESP32-S3-Touch-LCD-1.28 (SKU 25098/26959).
; GC9A01A 240x240 round LCD + CST816S capacitive touch.
[env:waveshare-s3-touch-lcd-1_28]
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
; ESP32-S3R2 uses 2 MB Quad-SPI PSRAM (not octal PSRAM).
board_build.arduino.memory_type = qio_qspi
lib_deps =
  ${env.lib_deps}
  bodmer/TFT_eSPI @ 2.5.43
  fbiego/CST816S @ 1.3.0
build_flags =
  ${env.build_flags}
  -D BOARD_HAS_PSRAM
  -D HMI_DISPLAY_KIND=1
  -D HMI_ROUND_DISPLAY=1
  -D HMI_TOUCH_ENABLED=1
  -D HMI_TOUCH_SDA=6
  -D HMI_TOUCH_SCL=7
  -D HMI_TOUCH_RST=13
  -D HMI_TOUCH_IRQ=5
  ; TFT_eSPI 2.5.43 + Arduino-ESP32 2.0.17 requires SPI3/HSPI on S3.
  ; Its default FSPI macro is 0, while the library's register code expects 2/3.
  -D USE_HSPI_PORT=1
  -D GC9A01_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D TFT_MISO=12
  -D TFT_MOSI=11
  -D TFT_SCLK=10
  -D TFT_CS=9
  -D TFT_DC=8
  -D TFT_RST=14
  -D TFT_BL=2
  -D TFT_BACKLIGHT_ON=HIGH
  -D TOUCH_CS=-1
  -D SPI_FREQUENCY=80000000
  -D SPI_READ_FREQUENCY=20000000

; Standalone visual smoke test: SAFE and ATTACK alternate every 8 seconds.
; It does not connect to Wi-Fi and must not be used as a real status terminal.
[env:waveshare-s3-touch-lcd-1_28-demo]
extends = env:waveshare-s3-touch-lcd-1_28
build_flags =
  ${env:waveshare-s3-touch-lcd-1_28.build_flags}
  -D HMI_DEMO_MODE=1

; ESP32 DevKit + ILI9341 320x240 connected over VSPI.
[env:esp32dev-ili9341]
platform = espressif32 @ 6.13.0
board = esp32dev
lib_deps =
  ${env.lib_deps}
  bodmer/TFT_eSPI @ 2.5.43
build_flags =
  ${env.build_flags}
  -D HMI_DISPLAY_KIND=1
  -D HMI_ROUND_DISPLAY=0
  -D HMI_TOUCH_ENABLED=0
  -D ILI9341_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=19
  -D TFT_MOSI=23
  -D TFT_SCLK=18
  -D TFT_CS=5
  -D TFT_DC=27
  -D TFT_RST=33
  -D TFT_BL=32
  -D TFT_BACKLIGHT_ON=HIGH
  -D TOUCH_CS=-1
  -D SPI_FREQUENCY=40000000

; ESP32-2432S028R, commonly called the Cheap Yellow Display (CYD).
[env:esp32-2432s028r]
platform = espressif32 @ 6.13.0
board = esp32dev
lib_deps =
  ${env.lib_deps}
  bodmer/TFT_eSPI @ 2.5.43
build_flags =
  ${env.build_flags}
  -D HMI_DISPLAY_KIND=1
  -D HMI_ROUND_DISPLAY=0
  -D HMI_TOUCH_ENABLED=0
  -D ILI9341_2_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D SPI_FREQUENCY=40000000

; ESP32 DevKit + SSD1306 128x64 over I2C (SDA 21, SCL 22).
[env:esp32dev-ssd1306]
platform = espressif32 @ 6.13.0
board = esp32dev
lib_deps =
  ${env.lib_deps}
  olikraus/U8g2 @ 2.36.18
build_flags =
  ${env.build_flags}
  -D HMI_DISPLAY_KIND=2
  -D HMI_ROUND_DISPLAY=0
  -D HMI_TOUCH_ENABLED=0
  -D HMI_OLED_SDA=21
  -D HMI_OLED_SCL=22
  -D HMI_OLED_ADDRESS=0x3C

; Pure C++ tests for expiry, conservative alert handling and state recovery.
[env:native]
platform = native
framework =
test_framework = unity
test_build_src = no
lib_deps =
build_flags =
  -std=gnu++17
