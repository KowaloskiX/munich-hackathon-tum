name: ESP32 sniffer firmware

on:
  push:
    paths:
      - "firmware/esp32-sniffer/**"
      - ".github/workflows/esp32-sniffer.yml"
  pull_request:
    paths:
      - "firmware/esp32-sniffer/**"
      - ".github/workflows/esp32-sniffer.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install "platformio==6.1.19"
      - name: Test detector and lamp timing
        run: pio test -d firmware/esp32-sniffer -e native
      - name: Build both fleet nodes
        run: >-
          pio run -d firmware/esp32-sniffer
          -e sniffer-01
          -e sniffer-02
